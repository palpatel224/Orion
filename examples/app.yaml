apiVersion: orion/v1
kind: App
metadata:
  name: shop
spec:
  services:
    frontend:
      image: nginx:latest
      cpu: 1
      memory: 128
      disk: 2
      replicas: 1
    api:
      image: myorg/api:v1
      cpu: 1
      memory: 256
      disk: 4
      replicas: 1
  dependencies:
    frontend:
      - targetService: api
        maxNetworkCost: 5
