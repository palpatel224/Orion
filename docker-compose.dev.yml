version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: orion-etcd
    # Use a named volume to persist data across container restarts
    # This prevents stale leader keys from lingering
    volumes:
      - etcd_data:/etcd-data
    environment:
      # Store data in the mounted volume
      - ETCD_DATA_DIR=/etcd-data
      # Cleanup snapshots to prevent accumulation
      - ETCD_AUTO_COMPACTION_MODE=periodic
      - ETCD_AUTO_COMPACTION_RETENTION=24h
    command:
      - /usr/local/bin/etcd
      - --name=orion-etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
      # Important: These settings help prevent split-brain scenarios
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=orion-etcd=http://127.0.0.1:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=orion-etcd-cluster
      # Session settings
      - --heartbeat-interval=100
      - --election-timeout=1000
    ports:
      - "12379:2379"
      - "12380:2380"
    networks:
      - orion-network
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etcd_data:
    driver: local

networks:
  orion-network:
    driver: bridge
